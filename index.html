<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>729 (and counting)</title>
    <meta name="description" content="729 (and counting) women and girls in the U.S. allegedly lost their lives to femicide in 2024. This website visualizes their data.">

    <!-- Open Graph -->
    <meta property="og:title" content="729 (and counting)">
    <meta property="og:description" content="729 (and counting) women and girls in the U.S. allegedly lost their lives to femicide in 2024. This website visualizes their data.">
    <meta property="og:image" content="og-image.png">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="729 (and counting)">
    <meta name="twitter:description" content="729 (and counting) women and girls in the U.S. allegedly lost their lives to femicide in 2024. This website visualizes their data.">
    <meta name="twitter:image" content="og-image.png">

    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <section id="hero">
      <header id="hero-header">
        <div>
          <h1>Women allegedly killed<br>in the USA by men</h1>
          <p id="hero-subtitle">Source: <a href="https://womencountusa.org/the-databases" target="_blank" rel="noopener">WOMEN COUNT USA: Femicide Accountability Project</a> by Dawn Wilcox<br>This is a working database &amp; entries for each woman are in various stages of completion</p>
        </div>
        <div id="date-control">
          <input type="range" id="day-slider" min="0" max="231" value="0" />
          <span id="date-label"></span>
        </div>
      </header>

      <div id="canvas-container">
        <!-- p5 canvas renders here -->
        <div id="about-overlay" class="hidden">
          <p id="about-text"></p>
        </div>
      </div>

      <div id="back-hint" class="hidden">click anywhere to return</div>
    </section>

    <section id="names-section">
      <ul id="name-list"></ul>
    </section>

    <button id="scroll-top" aria-label="Scroll to top"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14V3M3 7l5-5 5 5"/></svg></button>

    <script src="text-slots.js"></script>
    <script src="sketch.js"></script>
    <script src="names.js"></script>
    <script>
      (() => {
        const btn = document.getElementById('scroll-top');
        window.addEventListener('scroll', () => {
          btn.classList.toggle('visible', window.scrollY > window.innerHeight * 0.5);
        }, { passive: true });
        btn.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      })();
    </script>
  </body>
</html>
